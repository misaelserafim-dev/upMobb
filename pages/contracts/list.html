<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Contratos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../assets/ico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style/contracts.css">
</head>
    <body>
        <main class="page-contracts">
            <header class="page-header">

                <div class="container-header">
                    <img src="../../assets/logomarca.png" alt="Logo da empresa" class="logo">
                    <button type="button" id="btn-new-contract">Novo contrato</button>
                </div>
                
                <div class="contracts-filters">
                    <input id="search-input" type="text" placeholder="Buscar contrato">

                    <select id="status-filter">
                        <option value="">Todos</option>
                        <option value="1">Não enviado</option>
                        <option value="2">Aguardando assinatura</option>
                        <option value="3">Assinado</option>
                        <option value="4">Cancelado</option>
                    </select>

                    <select id="sort-filter">
                        <option value="recent">
                            Mais recentes
                        </option>

                        <option value="old">
                            Mais antigos
                        </option>
                    </select>
                </div>
            </header>

            <section id="contracts-content"></section>
            
            <!-- modal do preview -->
            <div id="preview-modal"></div>

        </main>
    </body>
    <script type="module" src="../../scripts/contracts/list.js"></script>
</html>
